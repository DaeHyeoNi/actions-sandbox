name: Create PR master → staging (gh)

on:
  schedule:
    - cron: "0 0 * * 5"   # 금 09:00 KST
  workflow_dispatch:

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Check if PR exists
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh pr list --state open --base staging --head master --json number --jq 'length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Create PR (master → staging)
        if: steps.check.outputs.count == '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base staging \
            --head master \
            --title "Sync master → staging" \
            --body "자동 생성된 PR입니다.\nmaster 브랜치를 staging으로 머지합니다. (자동 머지 없음)" \
            --label auto-pr --label staging
