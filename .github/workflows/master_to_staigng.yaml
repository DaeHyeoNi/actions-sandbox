name: Create staging deploy PR

on:
  # 매주 금요일 오전 9시 KST에 실행
  schedule:
    - cron: "0 0 * * 5"
  # 필요 시 수동으로 실행 가능
  workflow_dispatch:

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check if PR exists
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh pr list --state open --base staging --head master --json number -q 'length(.)')
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Create PR (master → staging)
        if: steps.check.outputs.count == '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base staging \
            --head master \
            --title "Sync master → staging" \
            --body "자동 생성된 PR입니다.\nmaster 브랜치를 staging으로 머지합니다. (자동 머지 없음)" \
            --label auto-pr --label staging
