name: Create staging deploy PR

on:
  # 매주 금요일 오전 9시 KST에 실행
  schedule:
    - cron: "0 0 * * 5"
  # 필요 시 수동으로 실행 가능
  workflow_dispatch:

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: staging   # 머지 대상 브랜치
          head: master       # 소스 브랜치
          title: "Sync master -> staging"
          body: |
            자동 생성된 PR입니다.
            dev 브랜치를 staging으로 머지합니다.
          branch: dev-to-staging-pr
          labels: |
            auto-pr
            staging
