name: Create staging deploy PR

on:
  # 매주 금요일 오전 9시 KST에 실행
  schedule:
    - cron: "0 0 * * 5"
  # 필요 시 수동으로 실행 가능
  workflow_dispatch:

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create Pull Request from dev to staging
        uses: peter-evans/create-pull-request@v3
        with:
          title: 'Merge master into staging'
          commit-message: 'Merge master into staging'
          branch: 'master'
          base: 'staging'
          body: |
            This is an automated pull request to merge changes from the `dev` branch into the `staging` branch.
          token: ${{ secrets.GITHUB_TOKEN }}
